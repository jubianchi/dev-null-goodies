[project]
name = "dev-null-goodies"
version = "0.1.0"
description = "Tooling for the /dev/null printable goodies"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE-MIT"]
dependencies = [
    "manifold3d>=3.5.5",
    "numpy>=2",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
